 radial-gradient(circle at 70% 88%,#ffc2dd 0 3px,transparent 4px),radial-gradient(circle at 30% 70%,#ffd9ea 0 2px,transparent 3px),radial-gradient(circle at 92% 55%,#ffd9ea 0 3px,transparent 4px)}

.gr b{font:800 14px/1.3 var(--disp);color:#fff}.gr b small{display:block;font:700 12px var(--body);color:var(--gold)}.gr p{margin:0;font-size:13px;line-height:1.6}.gr .kyo{color:#ffb3bd}.gr .tk{display:inline-block;margin:0 4px 2px 0;padding:0 8px;border-radius:99px;background:linear-gradient(90deg,#ffd84a,#ff9ad0);color:#3a1d00;font-weight:800}.gr .tq{display:inline-block;margin-top:2px;padding:0 8px;border-radius:99px;border:1px solid var(--teal);color:#bff6ef;font-weight:800}.gr .tka{color:#ffe9a8}.gr .gk{display:inline-block;margin:4px 4px 0 0;padding:0 8px;border-radius:99px;background:#5a1020;color:#ffd6ec;border:1px solid var(--red);font-weight:800}.gr .note2{display:block;margin-top:3px;font-size:12.5px;color:#ffd6ec}.gr .dai{color:var(--yellow)}
.aisho{--c:var(--pink)}.aiTop{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}

.heart b{font:800 34px/1 var(--disp);color:#fff;text-shadow:0 0 10px var(--pink)}.heart small{font-size:12px;color:#ffd6ec}
.aiT{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.aiT th,.aiT td{border:1px solid #3a2a5a;padding:5px 6px;vertical-align:top;text-align:left}.aiT th{color:var(--gold);white-space:nowrap}

 .aiT tr{display:grid;grid-template-columns:1fr 1fr;border:1px solid #3a2a5a;border-radius:6px;margin-top:6px}.aiT th,.aiT td{border:0}
 .aiT tr>th{grid-column:1/-1;background:#1a0a2e}.aiT td:last-child{grid-column:1/-1;border-top:1px dashed #3a2a5a}
 .aiT td:nth-of-type(1)::before{content:"自分　";color:var(--sub)}.aiT td:nth-of-type(2)::before{content:"相手　";color:var(--sub)}
 .gr{grid-template-columns:1fr}.heart{width:96px;height:96px}.aiTop .who2 b{font-size:18px}}
.faceTop{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}#facePic{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1.5px solid var(--mag)}
.faceSel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.faceSel label{display:grid;gap:2px;font-size:12.5px;color:var(--sub)}.faceSel select{font:inherit;color:var(--fg);background:#07030e;border:1px solid var(--gold2);border-radius:6px;padding:6px}

@media (max-width:760px){
 .sheet{width:auto;padding:8px;gap:12px}

}

<script>
const $=id=>document.getElementById(id);
const TILES=[["shichu","四柱推命",12],["seimei","姓名判断",162],["suhi","数秘術",312],["kigaku","気学",456],["kyusei","九星気学",607],["ninso","人相学",757],["bio","運気バイオリズムグラフ",913]];
const on=Object.fromEntries(TILES.map(t=>[t[0],true]));

/* トップの部品 */
(function init(){
 const now=new Date().getFullYear();
 $("y").innerHTML='<option value="">年</option>'+Array.from({length:110},(_,i)=>now-i).map(v=>`<option>${v}</option>`).join("");
 $("m").innerHTML='<option value="">月</option>'+Array.from({length:12},(_,i)=>`<option>${i+1}</option>`).join("");
 $("d").innerHTML='<option value="">日</option>'+Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join("");
 $("py").innerHTML=$("y").innerHTML;$("pm").innerHTML=$("m").innerHTML;$("pd").innerHTML=$("d").innerHTML;
 $("hh").innerHTML=Array.from({length:24},(_,i)=>`<option value="${i}">${String(i).padStart(2,"0")}時</option>`).join("");
 $("mm").innerHTML=Array.from({length:60},(_,i)=>`<option value="${i}">${String(i).padStart(2,"0")}分</option>`).join("");
 $("blood").innerHTML=["A型","B型","O型","AB型","不明"].map((b,i)=>`<label><input type="radio" name="blood" value="${b}" id="bl${i}" ${b==="不明"?"checked":""}>${b}</label>`).join("");
 ["btNo","btYes"].forEach(id=>$(id).addEventListener("change",()=>{const y=$("btYes").checked;$("hh").disabled=!y;$("mm").disabled=!y}));
 $("tiles").innerHTML=TILES.map(([k,n,x])=>`<button type="button" class="tile sprite" id="t_${k}" aria-pressed="true" aria-label="${n}" style="background-position:${(x/(1080-145)*100).toFixed(2)}% ${(1276/(2400-225)*100).toFixed(2)}%"></button>`).join("");
 TILES.forEach(([k])=>$("t_"+k).addEventListener("click",e=>{on[k]=!on[k];e.currentTarget.setAttribute("aria-pressed",on[k])}));
 $("go").addEventListener("click",start);
 $("pClear").addEventListener("click",()=>{["psei","pmei"].forEach(i=>$(i).value="");["py","pm","pd"].forEach(i=>$(i).selectedIndex=0);const r=document.querySelector("input[name=psex][value='']");if(r)r.checked=true});
})();

/* ===== 計算 ===== */
const KAN="甲乙丙丁戊己庚辛壬癸",SHI="子丑寅卯辰巳午未申酉戌亥";
const KAN_Y=["きのえ","きのと","ひのえ","ひのと","つちのえ","つちのと","かのえ","かのと","みずのえ","みずのと"];
const SHI_Y=["ね","うし","とら","う","たつ","み","うま","ひつじ","さる","とり","いぬ","い"];
const ANI=["🐭","🐮","🐯","🐰","🐲","🐍","🐴","🐑","🐵","🐔","🐶","🐗"];

 cx.shadowBlur=0;

 [["前厄",b-9],["本厄",b+9],["後厄",b+27],["死前厄",b+45]].forEach(([n,a])=>{if(a<0||a>100)return;const y=Y(self(a));

 [["占成人",b],["二回目成人",b+18],["三回目成人",b+36]].forEach(([n,a])=>{if(a>100)return;const y=Y(self(a));

 /* 現在 */

 cx.setLineDash([4,6]);cx.strokeStyle=css("--pink");cx.lineWidth=2;cx.beginPath();cx.moveTo(X(now),ny);cx.lineTo(X(now),H-B);cx.stroke();cx.setLineDash([]);

 cx.font="800 34px "+css("--disp");cx.fillStyle="#fff";cx.shadowColor=css("--pink");cx.shadowBlur=12;cx.fillText("現在",X(now)+(now<8?40:0),Math.max(36,ny-56));

 const bx=W-R-300,byy=T-6;cx.fillStyle="#1a0a2ecc";cx.strokeStyle="#7a5ad0";cx.lineWidth=2;cx.beginPath();cx.roundRect?cx.roundRect(bx,byy,290,96,10):cx.rect(bx,byy,290,96);cx.fill();cx.stroke();
 cx.fillStyle=css("--fg");cx.font="bold 20px "+css("--body");cx.fillText("歳を重ねるごとに",bx+145,byy+28);cx.fillText("波は小さくなり",bx+145,byy+54);cx.fillText("死に近づくほど平坦になる",bx+145,byy+80);

/* 人相学：ログインしたクロードで開いた時だけ写真を読む */
let sample=null;
(async()=>{try{sample=window.claude&&claude.use?await claude.use("sample"):null;if(sample){const l=await sample.limits().catch(()=>null);if(!l||!l.images)sample=null}}catch(e){sample=null}if(S&&on.ninso&&$("face"))faceInit()})();
/* クロード無しの時：顔の特徴を選ぶと、その場で人相学の鑑定を出す */
const FACE=[
 ["額",[["広い","頭の回転が速く、目上の引き立てを受けやすい"],["ふつう","考えと行動のつり合いが良い"],["狭い","行動が早く、現場で力を出す実践家"]]],
 ["眉",[["太く濃い","意志が強く、仲間を引っぱる親分肌"],["細く薄い","気配りが細やかで、人との和を大切にする"],["弓なり","感性が豊かで、人に好かれやすい"],["まっすぐ","筋を通す正直者、決めたらぶれない"]]],
 ["目",[["大きい","感情表現が豊かで、人を引きつける"],["細い","冷静で観察力があり、物事を見抜く"],["たれ目","やさしく親しみやすい、聞き上手"],["つり目","負けず嫌いで決断が早い"]]],
 ["鼻",[["高い","自尊心と行動力があり、仕事運が強い"],["低め","協調性があり、周りに助けられる"],["小鼻が張る","金運が強く、お金を貯める力がある"],["鼻筋が通る","まじめで信用され、財が積み上がる"]]],
 ["口",[["大きい","気前がよく、行動力と生活力がある"],["小さい","慎重で、身内や近い人を大切にする"],["口角が上がる","明るく前向き、人と運が寄ってくる"],["唇が厚い","情が深く、人に尽くす"]]],
 ["耳",[["大きい","運が強く、人の話をよく聞く"],["耳たぶが厚い","福耳。金運・晩年運に恵まれる"],["小さい","頭が切れ、自分の考えで動く"],["上の位置","知恵が回り、若いうちから伸びる"]]]
];
function faceManual(f){
 f.innerHTML=`<div class="faceTop"><img id="facePic" alt="鑑定に使う顔写真" hidden><div><label class="back" id="photo2L" for="photoIn" style="text-align:center;display:inline-block">写真を入れる（上の写真と同じ）</label><p class="small">顔の特徴を選ぶと鑑定が出ます（写真で読む鑑定は、クロードにログインして開いた時だけ使えます）。</p></div></div>
 <div class="faceSel">${FACE.map(([n,o],i)=>`<label><span>${n}</span><select data-i="${i}"><option value="">選ばない</option>${o.map((x,j)=>`<option value="${j}">${x[0]}</option>`).join("")}</select></label>`).join("")}</div><div id="faceOut"></div>`;
 const out=()=>{const rows=[...f.querySelectorAll("select")].filter(x=>x.value!=="").map(x=>{const [n,o]=FACE[+x.dataset.i],c=o[+x.value];return `<tr><th>${n}（${c[0]}）</th><td>${c[1]}</td></tr>`});
  $("faceOut").innerHTML=rows.length?`<table style="margin-top:8px">${rows.join("")}</table>`:""};
 f.querySelectorAll("select").forEach(x=>x.addEventListener("change",out));

function faceInit(){
 const f=$("face");if(!f)return;
 if(!sample){faceManual(f);return}
 f.innerHTML=`<div class="faceTop"><img id="facePic" alt="鑑定に使う顔写真" hidden><div><label class="back" id="photo2L" for="photo2" style="text-align:center;display:inline-block">顔の写真を選んで鑑定する</label><input id="photo2" type="file" accept="image/*" hidden><p class="small" id="faceMsg">正面を向いた明るい写真がよく読めます。上の写真欄に入れても鑑定します。写真はこの鑑定にだけ使い、残しません。</p></div></div><div id="faceOut"></div>`;
 $("photo2").addEventListener("change",e=>{const file=e.target.files[0];if(file)setPhoto(file)});
 showPhoto();if(S.photo)readFace();
}
/* 写真は上も下も一つ：どちらで入れても両方に出て、人相学の鑑定にも使う */
let photoUrl=null,faceSeq=0;
function setPhoto(file){S.photo=file;if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(file);showPhoto();readFace()}
function showPhoto(){if(!S||!S.photo||!photoUrl)return;
 const pb=$("photoBox");if(pb){pb.style.backgroundImage=`url("${photoUrl}")`;pb.classList.add("has");pb.querySelector("label").textContent="写真を変える"}
 const fp=$("facePic");if(fp){fp.src=photoUrl;fp.hidden=false}
 const l2=$("photo2L");if(l2)l2.textContent=sample?"写真を変えて鑑定する":"写真を変える（上の写真と同じ）"}
async function readFace(){const file=S&&S.photo;if(!sample||!file||!$("faceOut"))return;const my=++faceSeq;
 $("faceMsg").textContent="読んでいます…（30秒ほど）";$("faceOut").innerHTML="";
 try{const r=await sample.json("画像は人相学の鑑定のための顔写真です。写っている顔の特徴だけを見て、人相学の考え方で答えてください。分からない所は推測しないでください。次の形の日本語の値だけで答えてください: {\"parts\":[{\"name\":\"額\",\"read\":\"40字以内\"},{\"name\":\"眉\",\"read\":\"\"},{\"name\":\"目\",\"read\":\"\"},{\"name\":\"鼻\",\"read\":\"\"},{\"name\":\"口\",\"read\":\"\"},{\"name\":\"耳\",\"read\":\"\"}],\"sum\":\"全体のまとめ60字以内\"}。顔が写っていない時は {\"parts\":[],\"sum\":\"顔が見つかりませんでした\"}。",{images:[file]});
  if(my!==faceSeq||!$("faceOut"))return;
  $("faceOut").innerHTML=`<table>${(r.parts||[]).map(p=>`<tr><th>${esc(p.name)}</th><td>${esc(p.read)}</td></tr>`).join("")}</table><p style="margin:8px 0 0">${esc(r.sum||"")}</p>`;$("faceMsg").textContent="鑑定しました。";
 }catch(err){if(my!==faceSeq||!$("faceMsg"))return;$("faceMsg").textContent=err&&err.code==="rate_limited"?"今は混んでいます。少し待ってからもう一度選んでください。":"読めませんでした。別の写真で試してください。"}}
/* ===== 相性（自分×相手） 流派で差があります ===== */
const GO="木火土金水";
const goOfJin=n=>["水","木","木","火","火","土","土","金","金","水"][n%10];
const KYU_GO=["水","土","木","木","土","金","金","土","火"];
const REL_W={name:["名前の気が同じで、言わなくても通じやすい","名前の気が助け合い、話すほど伸ばし合える","名前の気がぶつかりやすい。言葉の行き違いに気をつけると伸びる"],
 kyu:["生まれ星の気が同じで、暮らしのペースが合う","生まれ星が支え合い、一緒にいると運が回る","生まれ星の気が反発しやすい。歩調を合わせる工夫で伸びる"],
 kan:["本質が似ていて、気持ちが分かり合える","本質どうしが育て合う、伸びやかな縁","本質がぶつかりやすい。相手のやり方を尊重すると良い"]};
function goRel(a,b,ctx){const w=REL_W[ctx||"name"],i=GO.indexOf(a),j=GO.indexOf(b);if(i===j)return[4,"比和",w[0]];
 if((i+1)%5===j||(j+1)%5===i)return[5,"相生",w[1]];return[2,"相剋",w[2]]}
function shiRel(a,b){const g=x=>[0,1,2,3].find(k=>[[0,4,8],[1,5,9],[2,6,10],[3,7,11]][k].includes(x));
 if(a===b)return[4,"同支","似た者どうしで安心できる"];if(g(a)===g(b))return[5,"三合","大きな目標で力を合わせられる最良の縁"];
 if((a+b)%12===1)return[5,"六合","寄り添い支え合う、結びつきの強い縁"];if((a-b+12)%12===6)return[2,"冲","引き合うが衝突も。距離感が大切"];return[3,"ふつう","ほどよい関係"]}
function kanRel(a,b){if(Math.abs(a-b)===5)return[5,"干合","強く引き合う縁（結婚の相性で重く見る組み合わせ）"];const r=goRel(KAN_G[a],KAN_G[b],"kan");return[r[0],r[1],r[2]]}
function numRel(a,b){const r=n=>n>9?reduce(String(n).split("").reduce((x,c)=>x+ +c,0)):n,x=r(a),y=r(b),G=[[1,5,7],[2,4,8],[3,6,9]];
 if(x===y)return[4,"同じ数","価値観が近く、分かり合える"];if(G.some(q=>q.includes(x)&&q.includes(y)))return[5,"同じ組","自然体で心地よくいられる"];return[3,"ちがう組","お互いにない物を学び合える"]}
function drawAisho(){
 const el=$("aisho");if(!el||!S.p)return;const p=S.p,ns=[...S.sei].length,pns=[...p.sei].length;
 const me={g:gakuOf(S.strokes,ns),P:pillars(S.y,S.m,S.d,S.h),lp:lifePath(S.y,S.m,S.d).n,ks:honmei(S.y,S.m,S.d)};
 const yo={g:gakuOf(p.strokes,pns),P:pillars(p.y,p.m,p.d,null),lp:lifePath(p.y,p.m,p.d).n,ks:honmei(p.y,p.m,p.d)};
 const rows=[];
 if(me.g.all&&yo.g.all){const a=goOfJin(me.g.g[1]),b=goOfJin(yo.g.g[1]);rows.push(["姓名判断（人格の五行）",`人格${me.g.g[1]}画・${a}`,`人格${yo.g.g[1]}画・${b}`,goRel(a,b,"name")])}
 rows.push(["四柱推命（日干）",`${KAN[me.P.day.s]}・${KAN_G[me.P.day.s]}`,`${KAN[yo.P.day.s]}・${KAN_G[yo.P.day.s]}`,kanRel(me.P.day.s,yo.P.day.s)]);
 rows.push(["干支（生まれ年）",`${SHI[me.P.year.b]}年 ${ANI[me.P.year.b]}`,`${SHI[yo.P.year.b]}年 ${ANI[yo.P.year.b]}`,shiRel(me.P.year.b,yo.P.year.b)]);
 rows.push(["九星気学（本命星）",KYU[me.ks-1],KYU[yo.ks-1],goRel(KYU_GO[me.ks-1],KYU_GO[yo.ks-1],"kyu")]);
 rows.push(["数秘術（運命数）",`${me.lp}`,`${yo.lp}`,numRel(me.lp,yo.lp)]);
 const sc=Math.round(rows.reduce((a,r)=>a+r[3][0],0)/(rows.length*5)*100);

 const sou=(g)=>!g.all?"画数が未確定":`総格${g.g[3]}画${BOOK[g.g[3]]?" "+esc(BOOK[g.g[3]][0].replace(/（.*/,"")):""}（${TOKU[g.g[3]]?"特大吉・"+TOKU[g.g[3]][0]:kk(g.g[3])[1]}）`;
 const gokeOf=(g,sex,who)=>{if(sex!=="女性"||!g.all)return"";const hit=[["人格",g.g[1]],["地格",g.g[2]],["外格",g.gai],["総格",g.g[3]]].filter(x=>GOKE.has(x[1]));
  return hit.length?`<p class="small" style="margin-top:6px"><span class="rk r2">後家数</span> ${who}の${hit.map(x=>x[0]+x[1]+"画").join("・")}：${GOKE_T}</p>`:""};
 el.innerHTML=`<div class="aiTop"><div class="who2"><small>自分</small><b>${esc(S.sei+S.mei)}</b><small>${sou(me.g)}</small></div>
  <div class="heart"><div><b>${sc}%</b><br><small>${word}</small></div></div>
  <div class="who2"><small>相手</small><b>${esc(p.sei+p.mei)}</b><small>${sou(yo.g)}</small></div></div>
  <table class="aiT"><tr><th>見るところ</th><th>自分</th><th>相手</th><th>相性</th></tr>${rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td><td><span class="rk r${r[3][0]}">${r[3][1]}</span><br>${r[3][2]}</td></tr>`).join("")}</table>
  ${gokeOf(me.g,S.sex,"自分")}${gokeOf(yo.g,p.sex,"相手")}
  ${yo.g.all&&BOOK[yo.g.g[3]]?`<p class="small" style="margin-top:8px"><b style="color:var(--gold)">相手の総格（${yo.g.g[3]}画）</b>：${esc(BOOK[yo.g.g[3]][5])}</p>`:""}
  ${yo.g.all&&BOOK[yo.g.g[1]]&&BOOK[yo.g.g[1]][2]?`<p class="small" style="margin-top:4px"><b style="color:var(--gold)">相手の人格（${yo.g.g[1]}画）</b>：${esc(BOOK[yo.g.g[1]][2])}</p>`:""}
  <div class="pst">${[...p.sei+p.mei].map((c,i)=>`<label class="cb"><span>${esc(c)}</span><input id="pst${i}" type="number" min="1" max="40" inputmode="numeric" placeholder="画数?" value="${p.strokes[i]}" aria-label="相手の${esc(c)}の画数"></label>`).join("")}</div>
  <p class="hint">${yo.g.all?"相手の画数も自動で入れています。違う時は直せます。":"相手の名前に画数が分からない字があります。赤い所に画数を入れると姓名判断の相性も出ます。"}相性の見方は流派で差があります。</p>`;
 [...p.sei+p.mei].forEach((c,i)=>$("pst"+i).addEventListener("change",e=>{p.strokes[i]=e.target.value;drawAisho()}));
}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
